# Monthly dependency updates, grouped so each ecosystem opens one PR a month
# for minor and patch bumps rather than one per package. npm major bumps sit
# outside the group and open their own PRs, so each gets its own look. A
# 7-day cooldown skips releases younger than a week, so a compromised version
# pulled within days is never proposed. Security updates for a known advisory
# are separate: they come from the repository's Dependabot security updates
# setting, not from this file, and open as soon as the advisory lands.
#
# Actions stay pinned by full commit SHA; Dependabot bumps the SHA and its
# version comment together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
