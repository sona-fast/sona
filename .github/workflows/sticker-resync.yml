# Scheduled auto re-sync of Telegram sticker packs.
#
# Cloudflare Pages can't run native cron, so GitHub Actions is the scheduler:
# it POSTs to the app's re-sync endpoint, which pulls any newly-added stickers
# into existing telegram-sourced packs (capped per run, idempotent).
#
# Required:
#   - repo secret CRON_SECRET (Settings → Secrets and variables → Actions)
#     matching the Pages secret of the same name (`wrangler pages secret put
#     CRON_SECRET`). Without it the endpoint returns 401/503 and this job fails.
#   - repo variable SITE_URL (Actions → Variables) = your site's base URL,
#     e.g. https://example.com.
name: Sticker auto re-sync

on:
  schedule:
    # Daily at 06:00 UTC (low-traffic). Adjust as needed; GitHub may delay
    # scheduled runs by a few minutes under load.
    - cron: '0 6 * * *'
  # Allow running it on demand from the Actions tab.
  workflow_dispatch: {}

# Don't pile up overlapping runs.
concurrency:
  group: sticker-resync
  cancel-in-progress: false

jobs:
  resync:
    runs-on: ubuntu-latest
    # The canonical template is intentionally unconfigured, so it must not run
    # fork workflows. Every fork (any other repo) runs this normally and fails
    # loudly if CRON_SECRET is missing — that's a real misconfiguration to fix.
    if: github.repository != 'sona-fast/sona'
    steps:
      - name: Trigger re-sync endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::SITE_URL repo variable is not set (Settings → Secrets and variables → Actions → Variables) — set it to your site's base URL, e.g. https://example.com"; exit 1
          fi
          # Sticker re-sync is OPTIONAL (a fork may not mirror Telegram packs), so
          # an unset secret means "not opted in" — skip quietly, don't fail. Deploy
          # (which is mandatory) still fails loudly on missing creds.
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET not set — skipping scheduled re-sync (optional; set the repo secret to opt in)"; exit 0
          fi
          code=$(curl -sS --max-time 120 -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/resync-telegram")
          echo "HTTP $code"
          cat response.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Re-sync endpoint returned HTTP $code"; exit 1
          fi
