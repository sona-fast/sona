# Scheduled storage orphan cleanup.
#
# Like the artist/sticker syncs, GitHub Actions is the scheduler: it POSTs to
# the app's cleanup endpoint, which deletes stored objects (canceled/refreshed
# uploads) that no database row references and that are older than 48h.
# Bounded + idempotent.
#
# Required:
#   - repo secret CRON_SECRET (matches the Pages secret of the same name).
#   - repo variable SITE_URL = your site's base URL (e.g. https://example.com).
name: Storage orphan cleanup

on:
  schedule:
    # Weekly, Mondays at 07:00 UTC (after the daily syncs).
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

concurrency:
  group: cleanup-orphans
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # The canonical template is intentionally unconfigured, so it must not run
    # fork workflows. Every fork (any other repo) runs this normally.
    if: github.repository != 'sona-fast/sona'
    steps:
      - name: Trigger cleanup-orphans endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::SITE_URL repo variable is not set (Settings → Secrets and variables → Actions → Variables) — set it to your site's base URL, e.g. https://example.com"; exit 1
          fi
          # Cleanup is OPTIONAL — an unset secret means "not opted in": skip
          # quietly, don't fail. Deploy (which is mandatory) still fails loudly
          # on missing creds.
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET not set — skipping scheduled cleanup (optional; set the repo secret to opt in)"; exit 0
          fi
          code=$(curl -sS --max-time 120 -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/cleanup-orphans")
          echo "HTTP $code"; cat response.json || true; echo
          if [ "$code" = "503" ]; then
            echo "Cron is not configured on the site (no CRON_SECRET Pages secret) — skipping."; exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Cleanup endpoint returned HTTP $code"; exit 1
          fi
          # A provider can SKIP itself (zero-keep safety belt) while the run
          # stays HTTP 200. Surface that as a warning so the anomaly shows in
          # the run list, but do NOT fail the run — an empty-but-alive fork
          # trips the belt legitimately and would otherwise be permanently red.
          skipped=$(jq -r '(.skipped // []) | join("; ")' response.json 2>/dev/null || true)
          if [ -n "$skipped" ]; then
            echo "::warning::Cleanup skipped a provider: $skipped"
          fi
