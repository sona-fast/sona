name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # GitHub's "Sync fork" button fast-forwards main WITHOUT emitting a push
  # event, so a synced fork never auto-deploys. This gives operators a manual
  # "Run workflow" button in the Actions tab for exactly that case.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The canonical template is intentionally not a deployment (no Cloudflare
    # account/project/D1), so it must not run this. Every fork (any other repo)
    # runs it and fails loudly if the credentials are missing — a real setup
    # step to fix, not something to silently skip.
    if: github.repository != 'sona-fast/sona'
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: npm run build

      # Fail fast with a clear, actionable message if a fork runs this without
      # Cloudflare credentials (rather than a cryptic wrangler error three steps
      # later). The template never reaches here — the job is gated off above.
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — run 'npm run setup' or add both in Settings → Secrets and variables → Actions to enable deploys"; exit 1
          fi

      # Per-deployment names. Set repo variables CLOUDFLARE_PAGES_PROJECT and
      # D1_DATABASE_NAME (Settings → Secrets and variables → Actions → Variables);
      # they default to the Sona template names when unset.
      - name: Create Pages project if needed
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'sona' }}
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${CLOUDFLARE_PAGES_PROJECT}\",\"production_branch\":\"main\"}" \
            | jq '.success // .errors'

      # Apply migrations with tracking: a schema_migrations table records which files
      # have run, so each is applied exactly once and a genuine SQL failure FAILS
      # the deploy (no more `|| true` masking a broken/half-applied schema).
      #
      # One-time baseline for a DB already migrated out-of-band (e.g. the original
      # sparky.ink prod): before the first run on the new pipeline, seed the table
      # so existing files aren't re-applied —
      #   for f in drizzle/*.sql; do
      #     wrangler d1 execute <db> --remote --command \
      #       "INSERT OR IGNORE INTO schema_migrations(name,applied_at) VALUES ('$(basename $f)', datetime('now'));"
      #   done
      # (Create the table first with the CREATE below.) Fresh forks need nothing.
      - name: Run D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || 'sona-db' }}
        run: |
          set -euo pipefail
          DB="$D1_DATABASE_NAME"
          npx wrangler d1 execute "$DB" --remote --command \
            "CREATE TABLE IF NOT EXISTS schema_migrations (name TEXT PRIMARY KEY, applied_at TEXT NOT NULL);"
          applied=$(npx wrangler d1 execute "$DB" --remote --json \
            --command "SELECT name FROM schema_migrations;" | jq -r '.[0].results[].name' 2>/dev/null || true)
          for f in drizzle/*.sql; do
            name=$(basename "$f")
            if printf '%s\n' "$applied" | grep -qxF "$name"; then
              echo "✓ already applied: $name"
              continue
            fi
            echo "→ applying: $name"
            npx wrangler d1 execute "$DB" --remote --file="$f"
            npx wrangler d1 execute "$DB" --remote --command \
              "INSERT INTO schema_migrations (name, applied_at) VALUES ('$name', datetime('now'));"
          done

      # Optional feature: FurTrack photo integration. Set the repo Actions
      # VARIABLE `FURTRACK_MODE` (Settings → Secrets and variables → Actions →
      # Variables) to `live` or `mock` and the next deploy turns it on — no
      # Cloudflare dashboard access needed. The PATCH merges per key (the Pages
      # API only touches the env vars you name; deleting one requires an
      # explicit null), so nothing else on the project is clobbered. Unset =
      # logged skip, zero behavior change for existing forks.
      - name: Sync FURTRACK_MODE to Pages project
        env:
          FURTRACK_MODE: ${{ vars.FURTRACK_MODE }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'sona' }}
        run: |
          set -euo pipefail
          if [ -z "$FURTRACK_MODE" ]; then
            echo "FURTRACK_MODE repo variable not set — skipping env var sync (FurTrack stays off)"
            exit 0
          fi
          payload=$(jq -n --arg v "$FURTRACK_MODE" \
            '{deployment_configs: {production: {env_vars: {FURTRACK_MODE: {type: "plain_text", value: $v}}}}}')
          resp=$(curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$payload")
          if ! echo "$resp" | jq -e '.success' >/dev/null; then
            echo "::error::Failed to set FURTRACK_MODE on Pages project ${CLOUDFLARE_PAGES_PROJECT}"
            echo "$resp" | jq '.errors'
            exit 1
          fi
          echo "FURTRACK_MODE=${FURTRACK_MODE} set on Pages project ${CLOUDFLARE_PAGES_PROJECT}"

      # Optional feature: observability (issue #6). Set the repo Actions VARIABLE
      # `OBSERVABILITY_ENABLED` (Settings → Secrets and variables → Actions →
      # Variables) to `true` and the next deploy turns the in-app metrics
      # dashboard on for this fork. Same per-key PATCH as FURTRACK_MODE above, so
      # nothing else on the project is touched. Unset = logged skip, feature stays
      # dormant (default off) — this is what keeps it a selective, per-fork opt-in.
      - name: Sync OBSERVABILITY_ENABLED to Pages project
        env:
          OBSERVABILITY_ENABLED: ${{ vars.OBSERVABILITY_ENABLED }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'sona' }}
        run: |
          set -euo pipefail
          if [ -z "$OBSERVABILITY_ENABLED" ]; then
            echo "OBSERVABILITY_ENABLED repo variable not set — skipping env var sync (observability stays off)"
            exit 0
          fi
          payload=$(jq -n --arg v "$OBSERVABILITY_ENABLED" \
            '{deployment_configs: {production: {env_vars: {OBSERVABILITY_ENABLED: {type: "plain_text", value: $v}}}}}')
          resp=$(curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$payload")
          if ! echo "$resp" | jq -e '.success' >/dev/null; then
            echo "::error::Failed to set OBSERVABILITY_ENABLED on Pages project ${CLOUDFLARE_PAGES_PROJECT}"
            echo "$resp" | jq '.errors'
            exit 1
          fi
          echo "OBSERVABILITY_ENABLED=${OBSERVABILITY_ENABLED} set on Pages project ${CLOUDFLARE_PAGES_PROJECT}"

      # Optional feature: Telegram sticker import. Add the repo Actions SECRET
      # `TELEGRAM_BOT_TOKEN` and it's synced to the Pages project here. Pages
      # secrets bind at deploy time, so putting it before the deploy below means
      # this very deployment picks it up. `secret put` is an upsert, so re-runs
      # are idempotent. Unset = logged skip. (The manual
      # `wrangler pages secret put` path from the setup-help modals still works
      # if you'd rather not give CI the token.)
      - name: Sync TELEGRAM_BOT_TOKEN to Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'sona' }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN repo secret not set — skipping secret sync (Telegram stickers stay off)"
            exit 0
          fi
          printf '%s' "$TELEGRAM_BOT_TOKEN" | \
            npx wrangler pages secret put TELEGRAM_BOT_TOKEN --project-name "$CLOUDFLARE_PAGES_PROJECT"
          echo "TELEGRAM_BOT_TOKEN synced to Pages project ${CLOUDFLARE_PAGES_PROJECT} (binds on the deploy below)"

      # Optional feature: admin password recovery ("Forgot password") email. Add
      # the repo Actions secrets `RESEND_API_KEY` (required to enable) and,
      # optionally, `RESEND_FROM` (sender identity, format "Name <you@domain>";
      # a custom domain must be verified in your own Resend account). Synced to
      # the Pages project here so this deploy binds them. Unset = logged skip;
      # recovery then falls back to the `npm run reset-password` CLI.
      - name: Sync RESEND secrets to Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'sona' }}
        run: |
          set -euo pipefail
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY repo secret not set — skipping secret sync (email password reset stays off; use npm run reset-password)"
            exit 0
          fi
          printf '%s' "$RESEND_API_KEY" | \
            npx wrangler pages secret put RESEND_API_KEY --project-name "$CLOUDFLARE_PAGES_PROJECT"
          echo "RESEND_API_KEY synced to Pages project ${CLOUDFLARE_PAGES_PROJECT}"
          if [ -n "$RESEND_FROM" ]; then
            printf '%s' "$RESEND_FROM" | \
              npx wrangler pages secret put RESEND_FROM --project-name "$CLOUDFLARE_PAGES_PROJECT"
            echo "RESEND_FROM synced to Pages project ${CLOUDFLARE_PAGES_PROJECT}"
          fi

      # Bootstrap + cron secrets. setup.ts sets SETUP_TOKEN (first-run wizard
      # gate) and CRON_SECRET (cron endpoint auth) as Pages secrets, but Pages
      # secrets bind at DEPLOY TIME and a fork's FIRST CI deploy does NOT bind a
      # secret that was only `put` in a prior session (setup.ts). Without this
      # re-sync a fresh CI-first onboarding shows "/admin/setup: SETUP_TOKEN is
      # not configured" until a second deploy, and the cron jobs 401. Re-putting
      # them here — right before the deploy, from the repo secrets setup.ts also
      # stores — guarantees THIS deployment binds them. `secret put` is an
      # idempotent upsert; unset (older forks / no CI wiring) = logged skip.
      - name: Sync SETUP_TOKEN + CRON_SECRET to Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'sona' }}
        run: |
          set -euo pipefail
          if [ -n "$SETUP_TOKEN" ]; then
            printf '%s' "$SETUP_TOKEN" | \
              npx wrangler pages secret put SETUP_TOKEN --project-name "$CLOUDFLARE_PAGES_PROJECT"
            echo "SETUP_TOKEN synced to Pages project ${CLOUDFLARE_PAGES_PROJECT} (binds on the deploy below)"
          else
            echo "SETUP_TOKEN repo secret not set — skipping (older fork, or wizard already completed)"
          fi
          if [ -n "$CRON_SECRET" ]; then
            printf '%s' "$CRON_SECRET" | \
              npx wrangler pages secret put CRON_SECRET --project-name "$CLOUDFLARE_PAGES_PROJECT"
            echo "CRON_SECRET synced to Pages project ${CLOUDFLARE_PAGES_PROJECT} (binds on the deploy below)"
          else
            echo "CRON_SECRET repo secret not set — skipping"
          fi

      # Optional feature: the Cloudflare "edge traffic" panel on /admin/observability.
      # Add the repo Actions secrets `CLOUDFLARE_ANALYTICS_TOKEN` (scope: Zone ·
      # Analytics · Read, Zone Resources limited to your zone) and `CLOUDFLARE_ZONE_ID`.
      # getCloudflareEdge() reads all three from the Worker env, and CLOUDFLARE_ACCOUNT_ID
      # is only a repo secret for deploys — it is NOT bound at runtime unless we put it
      # here too, so all three are synced. Pages secrets bind at deploy time, hence this
      # runs before the deploy below. `secret put` is an idempotent upsert; unset = logged
      # skip and the panel stays hidden.
      - name: Sync Cloudflare analytics secrets to Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'sona' }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_ANALYTICS_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "CLOUDFLARE_ANALYTICS_TOKEN / CLOUDFLARE_ZONE_ID repo secrets not both set — skipping (Cloudflare edge panel stays hidden)"
            exit 0
          fi
          printf '%s' "$CLOUDFLARE_ANALYTICS_TOKEN" | \
            npx wrangler pages secret put CLOUDFLARE_ANALYTICS_TOKEN --project-name "$CLOUDFLARE_PAGES_PROJECT"
          printf '%s' "$CLOUDFLARE_ZONE_ID" | \
            npx wrangler pages secret put CLOUDFLARE_ZONE_ID --project-name "$CLOUDFLARE_PAGES_PROJECT"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | \
            npx wrangler pages secret put CLOUDFLARE_ACCOUNT_ID --project-name "$CLOUDFLARE_PAGES_PROJECT"
          echo "Cloudflare analytics secrets synced to Pages project ${CLOUDFLARE_PAGES_PROJECT} (bind on the deploy below)"

      # Admin-login Turnstile bot check. The login action enforces the challenge
      # only when BOTH keys reach the Worker, so both are synced here: the sitekey
      # as a plain Pages var (it is public — it renders into the login page) and
      # the secret via `pages secret put`. `npm run setup` writes these straight to
      # Pages, which covers only NEW forks; an already-deployed fork sets the repo
      # VARIABLE TURNSTILE_SITEKEY + repo SECRET TURNSTILE_SECRET and this step
      # binds them on the next deploy — same reason CRON_SECRET/SETUP_TOKEN have a
      # sync step, since Pages secrets bind at deploy time.
      #
      # Half a config is the dangerous state: with only one of the two set the app
      # runs SILENTLY WITHOUT the bot check, indistinguishable from a fork that
      # deliberately opted out. So neither-set is a quiet skip, but exactly-one-set
      # FAILS the deploy rather than shipping a security control that isn't there.
      #
      # Turning it back OFF (e.g. a widget scoped to the wrong domain is rejecting
      # a valid login) takes more than clearing the repo settings — the values are
      # already on Pages and this step only ever writes. Delete TURNSTILE_SITEKEY
      # and TURNSTILE_SECRET from the Pages project (dashboard → Settings →
      # Environment variables) and redeploy; login falls back to throttle+password.
      - name: Sync TURNSTILE keys to Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'sona' }}
        run: |
          set -euo pipefail
          if [ -z "$TURNSTILE_SITEKEY" ] && [ -z "$TURNSTILE_SECRET" ]; then
            echo "TURNSTILE_SITEKEY / TURNSTILE_SECRET not set — skipping (admin login runs on the throttle + password alone)"
            exit 0
          fi
          if [ -z "$TURNSTILE_SITEKEY" ] || [ -z "$TURNSTILE_SECRET" ]; then
            echo "::error::Turnstile is half-configured — set BOTH the TURNSTILE_SITEKEY repo variable and the TURNSTILE_SECRET repo secret, or neither. With only one set the admin-login bot check is silently OFF."
            exit 1
          fi
          payload=$(jq -n --arg v "$TURNSTILE_SITEKEY" \
            '{deployment_configs: {production: {env_vars: {TURNSTILE_SITEKEY: {type: "plain_text", value: $v}}}}}')
          resp=$(curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload")
          if ! echo "$resp" | jq -e '.success' >/dev/null; then
            echo "::error::Failed to set TURNSTILE_SITEKEY on Pages project ${CLOUDFLARE_PAGES_PROJECT}"
            echo "$resp" | jq '.errors'
            exit 1
          fi
          printf '%s' "$TURNSTILE_SECRET" | \
            npx wrangler pages secret put TURNSTILE_SECRET --project-name "$CLOUDFLARE_PAGES_PROJECT"
          echo "TURNSTILE_SITEKEY + TURNSTILE_SECRET synced to Pages project ${CLOUDFLARE_PAGES_PROJECT} (bind on the deploy below)"

      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'sona' }}
