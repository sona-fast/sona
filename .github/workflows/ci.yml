name: CI

# The canonical template deliberately skips deploy.yml (no Cloudflare account),
# so its check/test/build never ran anywhere. This runs them ON the canonical
# repo. Forks already run the same steps inside deploy.yml, so this job is gated
# to the canonical repo to avoid duplicating that work on every fork.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.repository == 'sona-fast/sona'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20 # match deploy.yml
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: npm run build

  # Integration test for the local-dev self-bootstrap (#137): needs real wrangler
  # + a local D1 (miniflare), so it's out of the fast unit suite and run here.
  # Gated to the canonical repo like `check`/`e2e`; forks skip it (their deploy.yml
  # already runs check/test/build).
  integration:
    runs-on: ubuntu-latest
    if: github.repository == 'sona-fast/sona'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20 # match deploy.yml
          cache: npm

      - run: npm ci

      - run: npm run test:integration

  # Browser E2E (playwright). Separate from the unit suite so `npm test` stays
  # fast; gated to the canonical repo like `check`, and skipped on forks (their
  # deploy.yml already runs check/test/build).
  e2e:
    runs-on: ubuntu-latest
    if: github.repository == 'sona-fast/sona'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20 # match deploy.yml
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
