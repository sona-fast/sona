name: CI

# The canonical template deliberately skips deploy.yml (no Cloudflare account),
# so its check/test/build never ran anywhere. This runs them ON the canonical
# repo. Forks already run the same steps inside deploy.yml, so this job is gated
# to the canonical repo to avoid duplicating that work on every fork.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.repository == 'sona-fast/sona'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # match deploy.yml
          cache: npm

      # Fails if the lockfile resolves a guarded package (FLOORS in
      # scripts/check-lockfile-security-lib.mjs) below its security
      # floor — npm before 8.3 ignores the "pkg@<range>" override
      # keys, so an old-npm lockfile regen would revert them silently. Reads
      # package-lock.json only (no dependencies), so it runs BEFORE `npm ci`:
      # after it, a downgraded package's install scripts have already run.
      - run: npm run check:lockfile-security

      - run: npm ci

      # `prepare` recreates generated.css, so a commit that DELETED the file
      # leaves no diff to fail on — the working tree is clean and the file is
      # simply untracked. Assert it is still tracked before reading the diff.
      - run: git ls-files --error-unmatch src/lib/themes/generated.css

      # THIS is the drift guard (SONA-209). `npm ci` above runs `prepare`, which
      # runs `npm run themes` and rewrites src/lib/themes/generated.css from the
      # theme data — so a commit that edited a palette without regenerating
      # leaves a dirty working tree right here, and this step fails on it.
      - run: git diff --exit-code -- src/lib/themes/generated.css

      # Catches what prepare's rewrite hides: `prepare` ends in `|| echo ''`, so
      # theme data that fails to render at all (a bad value, an alias cycle, a
      # theme file nobody listed) leaves the stale CSS in place and installs
      # anyway. This runs the renderer with its exit code exposed.
      - run: npm run themes:check

      - run: npm run check

      - run: npm test

      - run: npm run build

      # Fails if a client chunk carries most of the message catalog — a
      # computed-key lookup into the paraglide namespace re-pinning it
      # (SONA-169). Needs the build output above.
      - run: npm run check:catalog-pinning

  # Integration test for the local-dev self-bootstrap (#137): needs real wrangler
  # + a local D1 (miniflare), so it's out of the fast unit suite and run here.
  # Gated to the canonical repo like `check`/`e2e`; forks skip it (their deploy.yml
  # already runs check/test/build).
  integration:
    runs-on: ubuntu-latest
    if: github.repository == 'sona-fast/sona'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # match deploy.yml
          cache: npm

      # Same pre-`npm ci` security floor guard as the `check` job (see there).
      - run: npm run check:lockfile-security

      - run: npm ci

      - run: npm run test:integration

  # Browser E2E (playwright). Separate from the unit suite so `npm test` stays
  # fast; gated to the canonical repo like `check`, and skipped on forks (their
  # deploy.yml already runs check/test/build).
  #
  # Split across four runners by project group (scripts/e2e-shards.ts), so each
  # boots only its own dev servers. The count in SONA_E2E_SHARD must match
  # E2E_SHARDS; playwright.config.ts refuses to start when it doesn't.
  e2e-shard:
    runs-on: ubuntu-latest
    if: github.repository == 'sona-fast/sona'
    # The slowest shard took about 20 minutes; a hang fails here, not at
    # GitHub's six-hour default.
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SONA_E2E_SHARD: ${{ matrix.shard }}/4

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # match deploy.yml
          cache: npm

      # Same pre-`npm ci` security floor guard as the `check` job (see there).
      - run: npm run check:lockfile-security

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # Samples memory every 15 seconds while the tests run, so a shard that
      # fails can be checked for memory pressure. A dev server's workerd that
      # dies mid-run is rebuilt by scripts/platform-proxy-heal.js, which logs a
      # [platform-proxy-heal] line; this shows whether memory was the cause.
      - name: Start memory sampler
        run: |
          nohup bash -c 'while :; do
            { date -u +%T; free -m | sed -n 2p; ps -eo rss=,comm= --sort=-rss | head -5; echo; } >> "$RUNNER_TEMP/memory.log"
            sleep 15
          done' > /dev/null 2>&1 &

      # The output is also kept in a file so the report below can find
      # [platform-proxy-heal] lines. shell: bash adds pipefail, so a test
      # failure still fails this step through the pipe.
      - name: Run e2e tests
        shell: bash
        run: npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      # Runs after a failure or the job timeout too. Prints the lowest available
      # memory, the last samples, any kernel out-of-memory or crash lines, and
      # how many dev servers were rebuilt after a workerd restart.
      - name: Memory report
        if: always()
        run: |
          log="$RUNNER_TEMP/memory.log"
          if [ -f "$log" ]; then
            echo "Lowest available memory (MB): $(awk '$1 == "Mem:" { print $7 }' "$log" | sort -n | head -1)"
            echo "Last samples:"
            tail -n 40 "$log"
          else
            echo "No memory samples were recorded."
          fi
          echo "Kernel out-of-memory and crash lines:"
          sudo dmesg -T | grep -iE 'out of memory|oom-kill|killed process|segfault|workerd' || echo "None."
          # A healed workerd crash lets the shard pass, so raise each one as a
          # warning on the run's summary page instead of leaving it in the log.
          heals=$(grep -c '\[platform-proxy-heal\]' "$RUNNER_TEMP/e2e.log" 2>/dev/null || true)
          echo "Dev servers rebuilt after a workerd restart: ${heals:-0}"
          grep '\[platform-proxy-heal\]' "$RUNNER_TEMP/e2e.log" 2>/dev/null | while IFS= read -r line; do
            echo "::warning title=workerd restarted under an e2e dev server::$line"
          done || true

  # The required status check. Branch protection names `e2e`, so this job keeps
  # that name and passes only when every shard did.
  e2e:
    runs-on: ubuntu-latest
    if: always() && github.repository == 'sona-fast/sona'
    needs: e2e-shard
    permissions: {}
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success
