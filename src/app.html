<!doctype html>
<html lang="%lang%" dir="%dir%" data-theme-id="%theme%" data-theme="%mode%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<script>
			// Resolve the "auto" mode (no saved preference) to the visitor's OS theme
			// before first paint, so light-mode users don't flash dark. Runs
			// synchronously in <head>; the toggle still overrides + persists a cookie.
			(function () {
				var e = document.documentElement;
				if (e.getAttribute('data-theme') === 'auto') {
					e.setAttribute(
						'data-theme',
						window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
					);
				}
			})();
		</script>
		<!-- The active theme's primary Latin face, filled in by src/hooks.server.ts.
		     Empty when the theme's headline family has no self-hosted file. -->
		%preload%
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
