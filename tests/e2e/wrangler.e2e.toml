# Wrangler config used ONLY by the E2E harness (playwright).
#
# The dev server for tests points at this file via SONA_E2E_WRANGLER_CONFIG so
# the tests get their own throwaway local D1 + persist dir (SONA_E2E_PERSIST_TO),
# never the developer's real wrangler.toml / dev database. See playwright.config.ts
# and tests/e2e/seed.ts. database_id is a local placeholder (miniflare only needs
# the binding + name locally); nothing here talks to a real Cloudflare account.

name = "sona-e2e"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

[vars]
FURTRACK_MODE = "off"
# Legacy env credential path: lets specs log in to /admin without seeding a
# PBKDF2 hash. Throwaway local value — never a real secret.
ADMIN_PASSWORD = "e2e-admin-password"
# Gates the password-recovery feature on (requestPasswordReset is inert without a
# key). Throwaway local value — the forgot-reset spec intercepts the Resend send
# (tests/e2e/resend-mock.mjs), so this key never reaches api.resend.com.
RESEND_API_KEY = "e2e-resend-key"
# Turns the /admin/observability dashboard on (it 302s to /admin when off) so
# the observability spec can assert the seeded visitor bars actually paint.
# Intentional side effects on the shared e2e server: every spec's page loads
# also write metric_rollup counters, and the admin gains an Observability nav
# item/settings tab — checked against the other shared-server specs (name-based
# selectors, isolated tables) and harmless.
OBSERVABILITY_ENABLED = "true"
# Cloudflare's official Turnstile TEST keys: the site key auto-solves the widget
# and the secret verifies ANY token as success — so admin login runs enforced
# (TURNSTILE_SECRET present) yet passes deterministically under Playwright. Not
# real secrets; safe to commit.
TURNSTILE_SITEKEY = "1x00000000000000000000AA"
TURNSTILE_SECRET = "1x0000000000000000000000000000000AA"
# TEST-ONLY early-access bypass (SONA-124, see app.d.ts): the vr-admin-form
# spec must reach the ungated /admin/vr/new form, the flag is pre-GA until its
# registry entry retires, and a real supporter key cannot be minted in CI (the
# issuer key is baked in). Honored only when exactly 'open'; never set this in
# a production wrangler.toml.
E2E_VR_GATE = "open"

[[d1_databases]]
binding = "DB"
database_name = "sona-e2e-db"
database_id = "e2e-local-placeholder"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "sona-e2e-images"
