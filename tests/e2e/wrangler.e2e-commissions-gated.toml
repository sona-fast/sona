# Wrangler config used ONLY by the gated commission ledger E2E server.
#
# Identical to wrangler.e2e.toml EXCEPT it leaves E2E_COMMISSION_GATE out, so
# the ledger's early-access gate is as a fork without a supporter key sees it
# before the GA date. It also leaves OBSERVABILITY_ENABLED out (nothing here
# reads the dashboard). Keep the bindings in sync with wrangler.e2e.toml.
# Everything here is a throwaway local value.

name = "sona-e2e"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

[vars]
FURTRACK_MODE = "off"
# Legacy env credential path. Throwaway local value — never a real secret.
ADMIN_PASSWORD = "e2e-admin-password"
# Throwaway local value; nothing on this server sends mail.
RESEND_API_KEY = "e2e-resend-key"
# Cloudflare's official Turnstile TEST keys (see wrangler.e2e.toml). Not real
# secrets; safe to commit.
TURNSTILE_SITEKEY = "1x00000000000000000000AA"
TURNSTILE_SECRET = "1x0000000000000000000000000000000AA"

[[d1_databases]]
binding = "DB"
database_name = "sona-e2e-db"
database_id = "e2e-local-placeholder"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "sona-e2e-images"
